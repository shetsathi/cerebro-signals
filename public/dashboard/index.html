<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerebro Signals — Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .status {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00d084;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 8px;
        }

        .summary-card label {
            font-size: 12px;
            color: #888;
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .summary-card .value {
            font-size: 24px;
            font-weight: 600;
            color: #00d084;
        }

        .signals-table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        .signals-table th {
            background: #252525;
            padding: 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #888;
            border-bottom: 1px solid #333;
        }

        .signals-table td {
            padding: 12px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 13px;
        }

        .signals-table tr:last-child td {
            border-bottom: none;
        }

        .action-long {
            background: rgba(0, 208, 132, 0.1);
            color: #00d084;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
        }

        .action-short {
            background: rgba(255, 74, 78, 0.1);
            color: #ff4a4e;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: rgba(255, 74, 78, 0.1);
            border: 1px solid #ff4a4e;
            color: #ff4a4e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        select {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
        }

        button {
            background: #00d084;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #00e59e;
        }

        .timestamp {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Cerebro Signals</h1>
            <div class="status">
                <div class="status-indicator"></div>
                <span>Live</span>
            </div>
        </div>

        <div class="summary">
            <div class="summary-card">
                <label>Total Signals</label>
                <div class="value" id="total-signals">0</div>
            </div>
            <div class="summary-card">
                <label>Long Signals</label>
                <div class="value" id="long-count" style="color: #00d084;">0</div>
            </div>
            <div class="summary-card">
                <label>Short Signals</label>
                <div class="value" id="short-count" style="color: #ff4a4e;">0</div>
            </div>
            <div class="summary-card">
                <label>Avg R:R</label>
                <div class="value" id="avg-rr">—</div>
            </div>
        </div>

        <div class="controls">
            <select id="symbol-select">
                <option value="NIFTY50">NIFTY50</option>
                <option value="RELIANCE">RELIANCE</option>
                <option value="INFY">INFY</option>
            </select>
            <button onclick="loadSignals()">Refresh</button>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="loading" class="loading" style="display: none;">Loading signals...</div>

        <table class="signals-table" id="signals-table" style="display: none;">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Symbol</th>
                    <th>Action</th>
                    <th>Entry</th>
                    <th>SL</th>
                    <th>Target</th>
                    <th>R:R</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="signals-tbody"></tbody>
        </table>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';

        async function loadSignals() {
            const symbol = document.getElementById('symbol-select').value;
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const table = document.getElementById('signals-table');

            loadingDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            table.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/signals?symbol=${symbol}&limit=50`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                const signals = data.signals || [];

                // Update summary
                document.getElementById('total-signals').textContent = signals.length;

                const longs = signals.filter(s => s.decision_action === 'LONG').length;
                const shorts = signals.filter(s => s.decision_action === 'SHORT').length;
                document.getElementById('long-count').textContent = longs;
                document.getElementById('short-count').textContent = shorts;

                const avgRR =
                    signals.length > 0
                        ? (
                              signals
                                  .filter(s => s.risk_reward_ratio)
                                  .reduce((sum, s) => sum + s.risk_reward_ratio, 0) / signals.length
                          ).toFixed(2)
                        : '—';
                document.getElementById('avg-rr').textContent = avgRR + 'x';

                // Populate table
                const tbody = document.getElementById('signals-tbody');
                tbody.innerHTML = '';

                signals.forEach((signal) => {
                    const row = document.createElement('tr');
                    const action =
                        signal.decision_action === 'LONG'
                            ? `<span class="action-long">📈 LONG</span>`
                            : `<span class="action-short">📉 SHORT</span>`;

                    const time = new Date(signal.evaluation_time_utc).toLocaleTimeString('en-US', {
                        timeZone: 'Asia/Kolkata',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                    });

                    row.innerHTML = `
                        <td class="timestamp">${time}</td>
                        <td>${signal.symbol}</td>
                        <td>${action}</td>
                        <td>${signal.entry_price.toFixed(2)}</td>
                        <td>${signal.stop_loss_price.toFixed(2)}</td>
                        <td>${signal.target_price ? signal.target_price.toFixed(2) : '—'}</td>
                        <td>${signal.risk_reward_ratio ? signal.risk_reward_ratio.toFixed(2) + 'x' : '—'}</td>
                        <td>${signal.status}</td>
                    `;
                    tbody.appendChild(row);
                });

                loadingDiv.style.display = 'none';
                table.style.display = 'table';
            } catch (error) {
                loadingDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.textContent = '❌ ' + error.message;
            }
        }

        // Auto-refresh every 10 seconds
        loadSignals();
        setInterval(loadSignals, 10000);
    </script>
</body>
</html>
